<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Almost connected | Orbit Print Studio</title>
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="style.css">
<style>
  .box { background: var(--panel); border-radius: 14px; padding: 22px; margin: 30px 0; }
  .url { font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; word-break: break-all; background: #0e1830; padding: 12px; border-radius: 8px; color: var(--muted); max-height: 9em; overflow: auto; }
  button { font: 700 16px system-ui, sans-serif; background: var(--accent); color: #14213d; border: 0; padding: 14px 26px; border-radius: 999px; cursor: pointer; margin-top: 14px; }
</style>
</head>
<body>
<main class="wrap">
  <div class="box">
    <h1 id="h">Almost connected</h1>
    <p id="msg">Copy this page's address and paste it into Agent HQ to finish connecting. This page doesn't send it anywhere.</p>
    <div class="url" id="url"></div>
    <button id="copy">Copy</button>
    <p class="muted" id="done" hidden>Copied. Go back to Agent HQ and paste it into the box, then tap Finish connecting.</p>
  </div>
</main>
<script>
  const u = location.href, q = new URLSearchParams(location.search);
  document.getElementById("url").textContent = u;
  if (q.get("error")) {
    document.getElementById("h").textContent = "Not connected";
    document.getElementById("msg").textContent = "The sign-in was cancelled or refused (" + (q.get("error_description") || q.get("error")) + "). Go back to Agent HQ and tap Connect again.";
  } else if (!q.get("code")) {
    document.getElementById("msg").textContent = "This page is where sign-ins land. Start from Connect in Agent HQ.";
    document.getElementById("copy").hidden = true;
  }
  document.getElementById("copy").onclick = async () => {
    try { await navigator.clipboard.writeText(u); }
    catch (e) { const t = document.createElement("textarea"); t.value = u; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); }
    document.getElementById("done").hidden = false;
  };
</script>
</body>
</html>
